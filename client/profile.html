<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - BesBoo</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .profile-container {
            padding: 40px 0 80px;
        }
        .profile-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 40px;
        }
        @media (max-width: 834px) {
            .profile-layout {
                grid-template-columns: 1fr;
            }
        }
        
        /* Sidebar Styles */
        .profile-sidebar {
            background-color: var(--canvas-parchment, #f5f5f7);
            border-radius: var(--rounded-lg, 18px);
            padding: 24px;
            height: fit-content;
        }
        .user-info-summary {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--hairline, #e0e0e0);
        }
        .user-avatar-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: var(--primary, #0066cc);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
            margin: 0 auto 16px;
        }
        .user-name-display {
            font-size: 17px;
            font-weight: 600;
            color: var(--ink, #1d1d1f);
            margin-bottom: 4px;
        }
        .user-email-display {
            font-size: 14px;
            color: var(--ink-muted-80, #333333);
        }
        
        .profile-nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .profile-nav-item {
            margin-bottom: 8px;
        }
        .profile-nav-link {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            color: var(--ink, #1d1d1f);
            text-decoration: none;
            border-radius: var(--rounded-md, 11px);
            transition: background-color 0.2s ease;
            font-size: 14px;
            font-weight: 500;
        }
        .profile-nav-link i {
            margin-right: 12px;
            width: 20px;
            text-align: center;
            color: var(--ink-muted-80, #333333);
        }
        .profile-nav-link:hover {
            background-color: rgba(0, 0, 0, 0.04);
        }
        .profile-nav-link.active {
            background-color: rgba(0, 102, 204, 0.1);
            color: var(--primary, #0066cc);
        }
        .profile-nav-link.active i {
            color: var(--primary, #0066cc);
        }
        
        /* Content Styles */
        .profile-content {
            background-color: var(--canvas, #ffffff);
            border-radius: var(--rounded-lg, 18px);
            border: 1px solid var(--hairline, #e0e0e0);
            padding: 32px;
        }
        .profile-section {
            margin-bottom: 40px;
        }
        .profile-section:last-child {
            margin-bottom: 0;
        }
        .profile-section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--ink, #1d1d1f);
        }
        
        /* Form Layout */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
        .form-actions {
            margin-top: 24px;
            display: flex;
            justify-content: flex-end;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 0;
            color: var(--ink-muted-80, #333333);
        }
        .loading-state i {
            font-size: 32px;
            margin-bottom: 16px;
            color: var(--primary, #0066cc);
        }
    </style>
</head>
<body>
    <div id="site-header"></div>

    <main class="profile-container">
        <div class="container">
            <!-- Breadcrumb -->
            <div class="breadcrumb" style="margin-bottom: 24px; font-size: 14px; color: var(--ink-muted-80);">
                <a href="/" style="color: inherit; text-decoration: none;">Trang chủ</a>
                <span style="margin: 0 8px;">/</span>
                <span style="color: var(--ink);">Tài khoản của tôi</span>
            </div>

            <div class="profile-layout" id="profileLayout" style="display: none;">
                <!-- Sidebar -->
                <aside class="profile-sidebar">
                    <div class="user-info-summary">
                        <div class="user-avatar-large" id="sidebarAvatar">?</div>
                        <div class="user-name-display" id="sidebarName">Đang tải...</div>
                        <div class="user-email-display" id="sidebarEmail">...</div>
                    </div>
                    
                    <ul class="profile-nav-list">
                        <li class="profile-nav-item">
                            <a href="./profile.html" class="profile-nav-link active">
                                <i class="fas fa-user"></i>
                                Thông tin tài khoản
                            </a>
                        </li>
                        <li class="profile-nav-item">
                            <a href="./orders.html" class="profile-nav-link">
                                <i class="fas fa-shopping-bag"></i>
                                Quản lý đơn hàng
                            </a>
                        </li>
                        <li class="profile-nav-item" style="margin-top: 24px; border-top: 1px solid var(--hairline, #e0e0e0); padding-top: 8px;">
                            <a href="#" class="profile-nav-link" id="logoutBtn" style="color: #e74c3c;">
                                <i class="fas fa-sign-out-alt" style="color: #e74c3c;"></i>
                                Đăng xuất
                            </a>
                        </li>
                    </ul>
                </aside>

                <!-- Main Content -->
                <div class="profile-content">
                    <div class="profile-section">
                        <h2 class="profile-section-title">Hồ sơ của tôi</h2>
                        <form id="profileForm">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="username">Tên đăng nhập</label>
                                    <input type="text" id="username" name="username" class="form-control" disabled style="background-color: #f9f9f9; color: #7a7a7a;">
                                </div>
                                <div class="form-group">
                                    <label for="email">Email</label>
                                    <input type="email" id="email" name="email" class="form-control" disabled style="background-color: #f9f9f9; color: #7a7a7a;">
                                </div>
                                <div class="form-group full-width">
                                    <label for="fullName">Họ và tên</label>
                                    <input type="text" id="fullName" name="fullName" class="form-control" required minlength="2">
                                </div>
                                <div class="form-group">
                                    <label for="phone">Số điện thoại</label>
                                    <input type="tel" id="phone" name="phone" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label for="address">Địa chỉ</label>
                                    <input type="text" id="address" name="address" class="form-control">
                                </div>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary" id="updateProfileBtn">Lưu thay đổi</button>
                            </div>
                        </form>
                    </div>

                    <hr style="border: 0; border-top: 1px solid var(--hairline, #e0e0e0); margin: 40px 0;">

                    <div class="profile-section">
                        <h2 class="profile-section-title">Đổi mật khẩu</h2>
                        <form id="passwordForm">
                            <div class="form-grid">
                                <div class="form-group full-width">
                                    <label for="currentPassword">Mật khẩu hiện tại</label>
                                    <input type="password" id="currentPassword" name="currentPassword" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label for="newPassword">Mật khẩu mới</label>
                                    <input type="password" id="newPassword" name="newPassword" class="form-control" required minlength="6">
                                </div>
                                <div class="form-group">
                                    <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required minlength="6">
                                </div>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-secondary-pill" id="changePasswordBtn" style="border: 1px solid var(--primary, #0066cc);">Đổi mật khẩu</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            
            <div id="loadingState" class="loading-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Đang tải thông tin...</p>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <!-- Scripts -->
    <script src="./js/product-data.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/components.js"></script>
    <script src="./js/auth-utils.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
